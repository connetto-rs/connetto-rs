[package]
name = "connetto-peer-apple"
description = "The Apple platform bridge for the connetto peer link, the joiner's Bluetooth permission read, the join a joiner's device asks the system for, the Network Extension's on iOS and CoreWLAN's on macOS, and the Bonjour discovery iOS needs, in the workspace's second unsafe crate."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# The workspace forbids unsafe code, and a forbid cannot be lowered in a crate
# that inherits it, so this crate restates the workspace's lints with
# `unsafe_code` at deny and lifts it only on the module that calls Apple.
[lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"
deprecated = "deny"
unknown_lints = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
thiserror.workspace = true

# The routing table the joined network's gateway is read from, the
# discovery session's constants, the Bluetooth permission read, and the
# locks, queues and framework objects the bridge's calls stand on.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
# The routing table the joined network's gateway is read from.
libc = "0.2"
# The dns_sd session the Bonjour discovery serves (R76).
connetto-peer = { path = "../connetto-peer", features = ["discovery"] }
parking_lot = "0.12"
dispatch2 = "0.3.1"
block2 = { version = "0.6", default-features = false, features = ["alloc"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSError",
  "NSObject",
  "NSString",
] }
# The app's Bluetooth permission, a class property of `CBManager` (R77
# decision 23).
objc2-core-bluetooth = { version = "0.3.2", default-features = false, features = [
  "std",
  "CBManager",
] }
if-addrs = "0.15"

# The Network Extension join the joiner's device asks iOS for.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-network-extension = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
] }

# The join the joiner's Mac asks CoreWLAN for, by its directed scan and its
# association.
[target.'cfg(target_os = "macos")'.dependencies]
# The Location Services access a join by name needs on macOS.
objc2-core-location = { version = "0.3.2", default-features = false, features = [
  "std",
  "CLLocationManager",
] }
objc2-core-wlan = { version = "0.3.2", default-features = false, features = [
  "std",
  "CWInterface",
  "CWNetwork",
  "CWWiFiClient",
] }
