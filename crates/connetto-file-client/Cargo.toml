[package]
name = "connetto-file-client"
description = "File client for connetto-rs: the local encrypted chunk store, the upload outbox, and the content resolver."
readme = "README.md"
categories = ["database", "asynchronous"]
keywords = ["sync", "offline", "files", "content-addressable", "upload"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# The workspace forbids unsafe code, and a forbid cannot be lowered in a crate
# that inherits it, so this crate restates the workspace's lints with
# `unsafe_code` at deny and lifts it only on the module measuring free space.
[lints.rust]
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"
deprecated = "deny"
unknown_lints = "allow"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[features]
default = ["native-tests"]
native-tests = []
# Serving content to linked devices over the peer link's media port (R79).
# Native only, like the peer link.
peer = ["connetto-client/peer", "dep:connetto-exchange", "dep:iroh-io", "dep:parking_lot"]

[[test]]
name = "it"
path = "tests/it/mod.rs"
required-features = ["native-tests"]

[dependencies]
connetto-file-core = { path = "../connetto-file-core" }
connetto-client = { path = "../connetto-client", default-features = false }
connetto-core = { workspace = true }
# Typed replica tables for the manifests, the outbox and the content pins.
diesel = { workspace = true }
thiserror.workspace = true
serde = { workspace = true }
serde_json = "1"
# The ticket address rule is the mint's own, decided on a parsed URL.
url = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
# The media messages and the per-peer machine the media driver runs.
connetto-exchange = { workspace = true, optional = true }
# The sink and source traits the verified range codec streams pieces through.
iroh-io = { version = "0.6", default-features = false, optional = true }
# The slot `resolve` reaches the running media driver through.
parking_lot = { version = "0.12", optional = true }

# The filesystem chunk store and the reqwest transport are native only. R68
# adds the OPFS store and a worker transport for wasm behind the same seams.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
connetto-client = { path = "../connetto-client", default-features = false, features = ["native-transport"] }
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# The streamed request body whose pulls the idle watchdog observes.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"

# The free space of the store's volume (R79 decision 16): the opportunistic
# capacity on Apple platforms, statvfs on the other Unix ones, and
# GetDiskFreeSpaceExW on Windows.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSError",
  "NSString",
  "NSURL",
  "NSValue",
] }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "DedicatedWorkerGlobalScope",
  "DomException",
  "File",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemRemoveOptions",
  "FileSystemWritableFileStream",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Request",
  "RequestInit",
  "RequestRedirect",
  "Response",
  "ResponseType",
  "StorageManager",
  "WorkerGlobalScope",
  "WorkerNavigator",
  "Url",
  "WritableStream",
  "XmlHttpRequest",
  "XmlHttpRequestEventTarget",
  "XmlHttpRequestResponseType",
  "XmlHttpRequestUpload",
] }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies]
connetto-test-harness = { path = "../connetto-test-harness" }
connetto-file-server = { path = "../connetto-file-server" }
connetto-server = { path = "../connetto-server", features = ["test-seams"] }
connetto-client = { path = "../connetto-client", default-features = false, features = ["native-transport", "native-auth", "test-support"] }
# The holder proofs serve a bare node's requests on loopback, its
# certificates minted in memory, under a translated policy schema.
connetto-peer = { path = "../connetto-peer", features = ["test-support"] }
connetto-schema.workspace = true
# The retention proofs apply a captured peer entry, whose manifest row names
# the SHA-256 of its body.
sha2 = "0.10"
# The custody proofs deliver the server's state column change as a live
# patch, compressed as bulk payloads ride the wire.
sqlite-diff-rs = { version = "0.20", default-features = false }
zstd = "0.13"
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "time"] }
tempfile = "3"
axum = { workspace = true }
diesel-async = { version = "0.10", default-features = false, features = ["postgres", "bb8"] }
bb8 = "0.9"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
