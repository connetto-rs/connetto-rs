# One SQL capability set on both targets (R21 decision 7). libsqlite3-sys reads
# LIBSQLITE3_FLAGS natively and sqlite-wasm-rs reads SQLITE_WASM_RS_FLAGS in the
# browser, and the two lists stay identical.
[env]
LIBSQLITE3_FLAGS = "SQLITE_ENABLE_MATH_FUNCTIONS SQLITE_ENABLE_FTS3 SQLITE_ENABLE_FTS3_PARENTHESIS SQLITE_SOUNDEX SQLITE_ENABLE_STAT4 SQLITE_ENABLE_OFFSET_SQL_FUNC SQLITE_ENABLE_BYTECODE_VTAB SQLITE_ENABLE_DBPAGE_VTAB SQLITE_ENABLE_STMTVTAB"
SQLITE_WASM_RS_FLAGS = "SQLITE_ENABLE_MATH_FUNCTIONS SQLITE_ENABLE_FTS3 SQLITE_ENABLE_FTS3_PARENTHESIS SQLITE_SOUNDEX SQLITE_ENABLE_STAT4 SQLITE_ENABLE_OFFSET_SQL_FUNC SQLITE_ENABLE_BYTECODE_VTAB SQLITE_ENABLE_DBPAGE_VTAB SQLITE_ENABLE_STMTVTAB"
