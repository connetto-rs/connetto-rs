name: Install the desktop dependencies
description: >-
  Installs the desktop webview libraries for Dioxus and Tauri, waiting up to five minutes for package installation locks.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get -o DPkg::Lock::Timeout=300 install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          lld
