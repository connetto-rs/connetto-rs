---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A main run is never cut short, and a newer merge replaces only the pending main run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Caches are saved only from main, which restores exact keys only, so a
# tree saved after a Cargo.lock change holds none of the artifacts the
# older lock left behind. A main run that fails or is cancelled saves its
# build output under its key with a -partial- suffix, which a later main run
# of the same lock restores, so a cold build its timeout cut short resumes.
# Pull requests also restore the nearest older key.
# Self-hosted runners skip these steps, since their host-mounted cargo
# registry and sccache already hold the same work without a download.
jobs:
  checks:
    name: Check ${{ matrix.name }}
    # Only pushes and same-repository pull requests may reach the self-hosted
    # runners on emi. LINUX_LIGHT names their scale set, and unset it means GitHub's.
    runs-on: &light-runner ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_LIGHT || 'ubuntu-26.04' }}
    timeout-minutes: 40
    # --all-features turns on the demo's device-identity feature, whose build
    # embeds a deployment root. These jobs never run the demo, so any file serves.
    env:
      CONNETTO_DEMO_BUILD_DEVICE_ROOT: /dev/null
    strategy:
      fail-fast: false
      matrix:
        # Every workspace, because a check that runs at the root alone leaves
        # each standalone one to drift: six files were unformatted when this
        # matrix replaced the single root run.
        include:
          - name: root native
            cwd: .
            target: ""
            flags: --all-features
          - name: connetto-web wasm
            cwd: crates/connetto-web
            target: --target wasm32-unknown-unknown
            flags: --all-features
          - name: wasm-smoke wasm
            cwd: examples/wasm-smoke
            target: --target wasm32-unknown-unknown
            flags: --all-features
          - name: dioxus-demo wasm
            cwd: examples/dioxus-demo
            target: --target wasm32-unknown-unknown
            flags: --no-default-features --features web
          - name: leptos-demo wasm
            cwd: examples/leptos-demo
            target: --target wasm32-unknown-unknown
            flags: ""
          - name: leptos-demo tauri wasm
            cwd: examples/leptos-demo
            target: --target wasm32-unknown-unknown
            flags: --no-default-features --features tauri
          - name: yew-web-demo wasm
            cwd: examples/yew-web-demo
            target: --target wasm32-unknown-unknown
            flags: --all-features
          - name: demo-support wasm
            cwd: examples/demo-support
            target: --target wasm32-unknown-unknown
            flags: --features web
          - name: webauthn-unlock wasm
            cwd: examples/webauthn-unlock
            target: --target wasm32-unknown-unknown
            flags: --all-features
          - name: dioxus-demo native
            cwd: examples/dioxus-demo
            target: ""
            flags: --all-features
          - name: tauri-leptos-demo native
            cwd: examples/tauri-leptos-demo
            target: ""
            flags: --all-features
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable rustfmt and clippy
        uses: $/.github/actions/install-rust
        with:
          components: rustfmt,clippy
          targets: ${{ matrix.target != '' && 'wasm32-unknown-unknown' || '' }}

      # The root legs pass --all-features, which turns on connetto-dioxus's
      # desktop feature and its webview stack, and Tauri links the same one.
      - name: Install desktop dependencies
        if: matrix.cwd == 'examples/dioxus-demo' || matrix.cwd == 'examples/tauri-leptos-demo' || matrix.cwd == '.'
        uses: $/.github/actions/install-desktop-deps

      # Tauri's context macro needs the frontend's output directory, which
      # only the Tauri CLI fills, and a check never builds the UI.
      - name: Stand in for the Tauri demo's UI build
        if: matrix.cwd == 'examples/tauri-leptos-demo'
        run: mkdir -p examples/leptos-demo/dist-tauri

      - name: Check formatting
        working-directory: ${{ matrix.cwd }}
        run: cargo +stable fmt --all -- --check

      # Clippy type-checks every target under these flags, so no separate cargo
      # check runs. Each check below runs even when one before it failed.
      - name: Run clippy
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.cwd }}
        run: |
          cargo +stable clippy \
            --all-targets \
            ${{ matrix.flags }} \
            ${{ matrix.target }} \
            -- \
            -D warnings

      - name: Check docs
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.cwd }}
        run: |
          RUSTDOCFLAGS="-D warnings" \
            cargo +stable doc \
              --no-deps \
              ${{ matrix.flags }} \
              ${{ matrix.target }}

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  nightly-clippy:
    # The gate's clippy, on the dated nightly ci/clippy-nightly names, so a
    # lint that fires only on nightly fails a pull request.
    name: Clippy root nightly
    runs-on: *light-runner
    timeout-minutes: 40
    env:
      CONNETTO_DEMO_BUILD_DEVICE_ROOT: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Read the pinned nightly
        id: nightly
        run: echo "toolchain=$(cat ci/clippy-nightly)" >> "$GITHUB_OUTPUT"

      - name: Install the pinned nightly with clippy
        uses: $/.github/actions/install-rust
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          components: clippy

      - name: Install desktop dependencies
        uses: $/.github/actions/install-desktop-deps

      - name: Run clippy
        env:
          TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: cargo "+$TOOLCHAIN" clippy --all-targets --all-features -- -D warnings

  android-clippy:
    # The gate's clippy for the Android target, on the same dated nightly, over
    # the crates with Android-only code, which no other job compiles for
    # Android.
    name: Clippy android
    runs-on: *light-runner
    timeout-minutes: 40
    env:
      CONNETTO_DEMO_BUILD_DEVICE_ROOT: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Read the pinned nightly
        id: nightly
        run: echo "toolchain=$(cat ci/clippy-nightly)" >> "$GITHUB_OUTPUT"

      - name: Install the pinned nightly with clippy and the Android target
        uses: $/.github/actions/install-rust
        with:
          toolchain: ${{ steps.nightly.outputs.toolchain }}
          components: clippy
          targets: aarch64-linux-android

      - name: Run clippy for Android
        env:
          TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          tc="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$tc/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$tc/llvm-ar"
          export RANLIB_aarch64_linux_android="$tc/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$tc/aarch64-linux-android29-clang"
          cargo "+$TOOLCHAIN" clippy \
            --target aarch64-linux-android \
            --all-features \
            -p connetto-client \
            -p connetto-peer-android \
            -p connetto-auth-session \
            -- -D warnings

  android:
    # R88: the phone build of the demo, built and linked without a
    # device. Its own job because the matrix legs pass their own flags, which
    # would switch the desktop renderer on for the phone.
    name: Build dioxus-demo android
    runs-on: *light-runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with the Android target
        uses: $/.github/actions/install-rust
        with:
          targets: aarch64-linux-android

      - name: Build the demo for Android
        working-directory: examples/dioxus-demo
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          tc="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$tc/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$tc/llvm-ar"
          export RANLIB_aarch64_linux_android="$tc/llvm-ranlib"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$tc/aarch64-linux-android29-clang"
          cargo +stable build \
            --target aarch64-linux-android \
            --no-default-features \
            --features mobile

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  rust-tests:
    name: Rust tests ${{ matrix.name }}
    # Only pushes and same-repository pull requests may reach the self-hosted
    # runners on emi. LINUX_HEAVY names their scale set, and unset it means GitHub's.
    runs-on: &heavy-runner ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_HEAVY || 'ubuntu-26.04' }}
    # A same-repository pull request runs these suites once, instrumented, in
    # coverage.yml. Forks and Dependabot get no Codecov token, and main runs
    # them here in release.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    # The discovery proofs fail here, never skip, when loopback multicast is
    # missing (R76 slice 3).
    env:
      CONNETTO_REQUIRE_MULTICAST: "1"
      # Pull requests build tests without thin LTO and with 16 codegen units.
      # Pushes to main keep the release profile, so a thin-LTO-only bug still
      # fails there. The secret-store script reads the same variable.
      CARGO_TEST_PROFILE: ${{ github.event_name == 'pull_request' && 'testfast' || 'release' }}
      CARGO_INCREMENTAL: "0"
      # Four parallel thin-LTO links peak at 21.8 GiB of a 32 GiB heavy VM.
      CARGO_BUILD_JOBS: ${{ github.event_name == 'pull_request' && 'default' || '4' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Sharded by package so no single shard hits the execution cap: the
      # heavy Docker-backed crates run alone or with their own family, and the
      # light ones share a shard. The graph compiles once per shard, which is
      # duplicated work traded for wall-clock under the cap.
      matrix:
        include:
          - name: server
            packages: -p connetto-server
            # The e2e tests spawn both binaries from the test profile's target dir,
            # and neither cargo test nor nextest builds another package's bin.
            bins: -p connetto-server -p connetto-client
          - name: client
            packages: -p connetto-client
            bins: ''
          - name: files
            packages: >-
              -p connetto-file-core
              -p connetto-file-server
              -p connetto-file-client
            bins: ''
          - name: rest
            packages: >-
              -p connetto-core
              -p connetto-schema
              -p connetto-ca
              -p connetto-test-harness
              -p connetto-dioxus
              -p connetto-yew
              -p connetto-peer
              -p connetto-exchange
              -p connetto-demo-support
            # The offline-exchange proof names the server binary, so the rest
            # shard compiles it beside its test binaries.
            bins: -p connetto-server
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore rust test output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: t-rust-tests-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-rust-tests-{0}-{1}-', matrix.name, runner.os) || format('t-rust-tests-{0}-{1}-{2}-partial-', matrix.name, runner.os, hashFiles('**/Cargo.lock')) }}

      - name: Install stable toolchain
        uses: $/.github/actions/install-rust

      # dbus-daemon backs the fake Secret portal the client suite starts.
      - name: Install keyring helpers
        run: |
          sudo apt-get update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y keyutils dbus gnome-keyring libdbus-1-dev pkg-config

      # --all-features turns on connetto-dioxus's desktop feature.
      - name: Install desktop dependencies
        if: matrix.name == 'rest'
        uses: $/.github/actions/install-desktop-deps

      - uses: taiki-e/install-action@nextest

      - name: Build spawned binaries
        if: matrix.bins != ''
        run: cargo +stable build --profile "$CARGO_TEST_PROFILE" --all-features --bins ${{ matrix.bins }}

      - uses: $/.github/actions/pull-test-images
      - uses: $/.github/actions/native-postgres

      # nextest rather than cargo test, matching the local runner: each test
      # gets its own process, which the merged tests/it targets rely on for
      # log-capture isolation, and a wedged test is killed and named instead
      # of holding the shard to the job timeout.
      - name: Run Rust suite
        env:
          # The offline-exchange proof reads the binary the build step
          # compiled, so the test does not build a server of its own.
          CONNETTO_SERVER_BIN: ${{ matrix.name == 'rest' && format('{0}/target/{1}/connetto-server', github.workspace, github.event_name == 'pull_request' && 'testfast' || 'release') || '' }}
        run: keyctl session -- cargo +stable nextest run --cargo-profile "$CARGO_TEST_PROFILE" --all-features --test-threads 4 ${{ matrix.packages }}

      - name: Prune target cache
        if: always()
        run: |
          rm -rf target/debug/incremental
          rm -rf target/release/incremental
          rm -rf target/wasm32-unknown-unknown/debug/incremental
          rm -rf target/wasm32-unknown-unknown/release/incremental
          rm -rf target/tmp

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save rust test output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

      - name: Save partial rust test output
        if: (failure() || cancelled()) && runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true' && steps.cache-2.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}-partial-${{ github.run_id }}

  custody-tests:
    # R71's Linux secret-store groups that need a private session bus, root,
    # Docker or a virtual display, which every run keeps.
    name: Custody tests
    runs-on: *heavy-runner
    env:
      CARGO_TEST_PROFILE: ${{ github.event_name == 'pull_request' && 'testfast' || 'release' }}
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore custody test output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: t-custody-tests-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-custody-tests-{0}-', runner.os) || format('t-custody-tests-{0}-{1}-partial-', runner.os, hashFiles('**/Cargo.lock')) }}

      - name: Install stable toolchain
        uses: $/.github/actions/install-rust

      - name: Install keyring helpers
        run: |
          sudo apt-get update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y keyutils dbus gnome-keyring libdbus-1-dev pkg-config

      - uses: taiki-e/install-action@nextest

      - uses: $/.github/actions/pull-test-images

      # coverage.yml runs this group instrumented whenever it runs the client suite.
      - name: Run Secret Service custody tests
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]'
        run: scripts/linux-secret-store-tests.sh secret-service

      - name: Run systemd unit custody tests
        run: scripts/linux-secret-store-tests.sh systemd

      - name: Run container custody tests
        run: scripts/linux-secret-store-tests.sh container

      # R71 proofs 4, 5 and 12: GNOME Keyring's and KDE Wallet's real dialogs
      # answered on a virtual display, and a real Flatpak through the Secret portal.
      - name: Run desktop custody proofs
        env:
          DESKTOP_PROOF_OUT: ${{ runner.temp }}/desktop-proofs
        run: scripts/linux-secret-store-tests.sh desktop

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-custody-proofs
          path: ${{ runner.temp }}/desktop-proofs
          if-no-files-found: ignore

      - name: Prune target cache
        if: always()
        run: |
          rm -rf "target/$CARGO_TEST_PROFILE/incremental"
          rm -rf target/tmp

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save custody test output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

      - name: Save partial custody test output
        if: (failure() || cancelled()) && runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true' && steps.cache-2.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}-partial-${{ github.run_id }}

  browser-build:
    name: Browser stack build
    # This job hands its binaries to the shards and the Android proof, so all
    # of them run on emi only while both scale-set variables name emi pools,
    # since put-files and get-files must pick the same store.
    runs-on: &paired-heavy-runner ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(vars.LINUX_LIGHT, 'ubuntu-') && !startsWith(vars.LINUX_HEAVY, 'ubuntu-') && vars.LINUX_LIGHT && vars.LINUX_HEAVY || 'ubuntu-26.04' }}
    # The server and the topology test binary, built once here instead of in
    # every shard, where they were most of the budget. Pull requests build
    # them in testfast like the Rust test jobs, and the harness reads the same
    # variable for the builds it starts.
    env:
      CARGO_TEST_PROFILE: ${{ github.event_name == 'pull_request' && 'testfast' || 'release' }}
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore native build output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: t-browser-native-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-browser-native-{0}-', runner.os) || format('t-browser-native-{0}-{1}-partial-', runner.os, hashFiles('**/Cargo.lock')) }}

      - name: Install stable browser toolchain
        uses: $/.github/actions/install-rust

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y libdbus-1-dev pkg-config

      - name: Build the browser stack
        run: |
          cargo +stable run \
            --profile "$CARGO_TEST_PROFILE" \
            -p connetto-test-harness \
            --bin connetto-browser-stack \
            -- \
            --build-only browser-bins

      # The Android emulator job runs these against browser-bins' server.
      - name: Build the Android proof
        run: |
          cargo +stable build \
            --profile "$CARGO_TEST_PROFILE" \
            -p connetto-test-harness \
            --bin connetto-demo-stack \
            --bin connetto-android-proof
          mkdir android-bins
          cp "target/$CARGO_TEST_PROFILE/connetto-demo-stack" "target/$CARGO_TEST_PROFILE/connetto-android-proof" android-bins/

      # Panic locations do not need the DWARF sections.
      - name: Strip debug sections from the prebuilt binaries
        run: strip --strip-debug browser-bins/* android-bins/*

      - uses: $/.github/actions/put-files
        with:
          name: browser-bins
          path: browser-bins

      - uses: $/.github/actions/put-files
        with:
          name: android-bins
          path: android-bins

      - name: Prune target cache
        if: always()
        run: |
          rm -rf target/debug/incremental
          rm -rf "target/$CARGO_TEST_PROFILE/incremental"
          rm -rf target/tmp

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save native build output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

      - name: Save the partial native build output
        if: (failure() || cancelled()) && runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true' && steps.cache-2.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}-partial-${{ github.run_id }}

  browser-tests:
    name: Browser tests ${{ matrix.shard }}/4
    needs: browser-build
    # Light VMs sit idle once the checks finish, while the heavy ones still run the suites.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(vars.LINUX_LIGHT, 'ubuntu-') && !startsWith(vars.LINUX_HEAVY, 'ubuntu-') && vars.LINUX_HEAVY && vars.LINUX_LIGHT || 'ubuntu-26.04' }}
    # A shard runs a quarter of the suites against its own machine-local
    # stack from the prebuilt binaries, so the serial rule inside one process
    # holds while the wall clock divides by four.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # File and line of a panic survive, and the rest of the debug info, which
    # only a debugger reads, would more than double the cached wasm tree.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      # The wasm tree in target-wasm is the one graph a shard still builds.
      - name: Restore wasm build output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target-wasm
          key: t-browser-wasm-lines-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-browser-wasm-lines-{0}-', runner.os) || format('t-browser-wasm-lines-{0}-{1}-partial-', runner.os, hashFiles('**/Cargo.lock')) }}

      - uses: $/.github/actions/get-files
        with:
          name: browser-bins
          path: browser-bins

      # Artifacts drop the executable bit.
      - name: Mark the prebuilt binaries executable
        run: chmod +x browser-bins/*

      - name: Install stable browser toolchain with the wasm target
        uses: $/.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Configure ChromeDriver
        run: |
          echo "${CHROMEWEBDRIVER}" >> "${GITHUB_PATH}"
          echo "CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "${GITHUB_ENV}"

      - uses: $/.github/actions/pull-test-images

      - name: Run browser suites
        env:
          CONNETTO_SERVER_BIN: ${{ github.workspace }}/browser-bins/connetto-server
          CONNETTO_TOPOLOGY_BIN: ${{ github.workspace }}/browser-bins/verified-topology
        run: browser-bins/connetto-browser-stack --shard ${{ matrix.shard }}/4

      - name: Prune target cache
        if: always()
        run: |
          rm -rf target-wasm/wasm32-unknown-unknown/debug/incremental
          rm -rf target-wasm/debug/incremental

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save wasm build output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target-wasm
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

      - name: Save partial wasm build output
        if: (failure() || cancelled()) && runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true' && steps.cache-2.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target-wasm
          key: ${{ steps.cache-2.outputs.cache-primary-key }}-partial-${{ github.run_id }}

  android-emulator:
    # R88's proof, walked on an emulator with the Tauri demo's APK, so the
    # Gradle build, the Kotlin sign-in plugin and the app itself run in CI.
    name: Android emulator proof
    needs: browser-build
    # On a light VM the proof timed out at the browser tab and at the keyguard.
    runs-on: *paired-heavy-runner
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore the demo's build output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: examples/tauri-leptos-demo/target
          key: t-android-emulator-tauri-${{ runner.os }}-${{ hashFiles('examples/tauri-leptos-demo/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-android-emulator-tauri-{0}-', runner.os) || format('t-android-emulator-tauri-{0}-{1}-partial-', runner.os, hashFiles('examples/tauri-leptos-demo/Cargo.lock')) }}

      - uses: $/.github/actions/get-files
        with:
          name: browser-bins
          path: browser-bins

      - uses: $/.github/actions/get-files
        with:
          name: android-bins
          path: android-bins

      # Artifacts drop the executable bit.
      - name: Mark the prebuilt binaries executable
        run: chmod +x browser-bins/* android-bins/*

      - name: Install stable toolchain with the emulator's target
        uses: $/.github/actions/install-rust
        with:
          targets: x86_64-linux-android

      - uses: $/.github/actions/install-tauri-tools

      # Vendored OpenSSL looks for a target-prefixed ar and ranlib the NDK no longer ships.
      - name: Point the Tauri CLI at the runner's Android SDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "NDK_HOME=$ndk"
            echo "AR_x86_64_linux_android=$bin/llvm-ar"
            echo "RANLIB_x86_64_linux_android=$bin/llvm-ranlib"
          } >> "${GITHUB_ENV}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "$bin" >> "${GITHUB_PATH}"

      # The demo's device CA, which the APK ships and the stack reuses (R74
      # decision 30).
      - name: Mint the demo's device CA
        run: echo "CONNETTO_DEMO_BUILD_DEVICE_ROOT=$(android-bins/connetto-demo-stack --mint-device-ca)" >> "${GITHUB_ENV}"

      # The same command the proof runs without --apk, built before the
      # emulator boots so the emulator's time goes to the proof. Line tables
      # keep a panic's file and line and halve the APK and the cached tree.
      - name: Build the demo's APK
        working-directory: examples/tauri-leptos-demo/src-tauri
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: cargo tauri android build --debug --apk --target x86_64 --features device-identity

      - uses: $/.github/actions/pull-test-images

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator writes the device log itself, which outlives the adb
      # server restarts the proof makes.
      - uses: $/.github/actions/boot-android-emulator
        with:
          logcat: ${{ runner.temp }}/emulator-logcat.txt

      # The Keystore gate (R52) needs a secure lock screen, so the run sets a throwaway PIN and types it.
      - name: Walk the proof on the emulator
        env:
          CONNETTO_SERVER_BIN: ${{ github.workspace }}/browser-bins/connetto-server
        run: |
          adb -s emulator-5554 shell locksettings set-pin 2580
          android-bins/connetto-demo-stack android-bins/connetto-android-proof --serial emulator-5554 --unlock-pin 2580 --app tauri --apk examples/tauri-leptos-demo/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk

      - name: Stop the emulator
        if: always()
        run: timeout 60 adb -s emulator-5554 emu kill || true

      # The adb server's own log records every change of the device's
      # transport, such as it going offline.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-proof-evidence
          path: |
            target/android-proof
            ${{ runner.temp }}/emulator-logcat.txt
            ${{ runner.temp }}/emulator.log
            /tmp/adb.*.log
          retention-days: 7

      - name: Prune the demo's target cache
        if: always()
        run: find examples/tauri-leptos-demo/target -type d -name incremental -prune -exec rm -rf {} +

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save the demo's build output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: examples/tauri-leptos-demo/target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

      - name: Save the partial demo build output
        if: (failure() || cancelled()) && runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true' && steps.cache-2.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: examples/tauri-leptos-demo/target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}-partial-${{ github.run_id }}

  file-core-wasm:
    name: File core wasm
    runs-on: *light-runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable browser toolchain with the wasm target
        uses: $/.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Configure ChromeDriver
        run: |
          echo "${CHROMEWEBDRIVER}" >> "${GITHUB_PATH}"
          echo "CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "${GITHUB_ENV}"
      # nextest skips doctests, and the README fence must execute.
      - name: Run file core doctests
        run: cargo +stable test --release --doc -p connetto-file-core


      # R64: the file core proves its whole surface under wasm, no services.
      - name: Run file core wasm tests
        run: wasm-pack test --headless --chrome crates/connetto-file-core

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  passkey-gate:
    name: Passkey gate
    runs-on: *light-runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Restore passkey build output
        if: runner.environment == 'github-hosted'
        id: cache-2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: examples/webauthn-unlock/target
          key: t-passkey-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('t-passkey-{0}-', runner.os) || format('t-passkey-{0}-{1}-partial-', runner.os, hashFiles('**/Cargo.lock')) }}

      - name: Install stable browser toolchain with the wasm target
        uses: $/.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Configure ChromeDriver
        run: |
          echo "${CHROMEWEBDRIVER}" >> "${GITHUB_PATH}"
          echo "CHROMEDRIVER=${CHROMEWEBDRIVER}/chromedriver" >> "${GITHUB_ENV}"

      # The R23 passkey gate's end-to-end driver. It lives in a workspace the
      # root excludes, so no other job can reach it, and it needs the wasm
      # package on disk before it can drive a browser at it. It serves its
      # own page and spawns no stack services, so it runs beside the shards.
      - name: Build the passkey demo package
        run: wasm-pack build examples/webauthn-unlock --target web

      - name: Run the passkey gate driver
        working-directory: examples/webauthn-unlock
        run: |
          set -o pipefail
          rm -rf target/passkey-gate
          mkdir -p target/passkey-gate
          cargo +stable test --release --test webauthn_unlock -- --nocapture 2>&1 | tee target/passkey-gate/test.log

      - name: Upload passkey failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: passkey-gate-diagnostics
          path: examples/webauthn-unlock/target/passkey-gate
          retention-days: 7

      - name: Prune target cache
        if: always()
        run: |
          rm -rf examples/webauthn-unlock/target/release/incremental
          rm -rf examples/webauthn-unlock/target/wasm32-unknown-unknown/release/incremental

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

      - name: Save passkey build output
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: examples/webauthn-unlock/target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}

      - name: Save partial passkey build output
        if: (failure() || cancelled()) && runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-2.outputs.cache-hit != 'true' && steps.cache-2.outputs.cache-primary-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: examples/webauthn-unlock/target
          key: ${{ steps.cache-2.outputs.cache-primary-key }}-partial-${{ github.run_id }}
