---
name: echoes organization

"on":
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echoes-organization
  cancel-in-progress: false

# Compares the default branches of every connetto-rs repository as one corpus.
# Existing duplicates fail it, so it stays out of the required checks.
jobs:
  audit:
    name: Echoes across connetto-rs
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: LucaCappelletti94/cargo-echoes@9d3e3917cbfde54b75a50204df645e33d8274b59 # v1.11.0
        with:
          organizations: connetto-rs
          version: 0.12.0
          threshold: 2
          min-tokens: 0
          functions: true
          fn-min-tokens: 30
          context-blocks: true
          context-min-tokens: 30
          all-targets: true
