---
name: Coverage

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Caches are saved only from main, which restores exact keys only, so a
# tree saved after a Cargo.lock change holds none of the artifacts the
# older lock left behind. Pull requests also restore the nearest older key.
jobs:
  coverage:
    name: Coverage ${{ matrix.name }}
    # Only pushes and same-repository pull requests may reach the self-hosted
    # runners on emi. LINUX_HEAVY names their scale set, and unset it means GitHub's.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_HEAVY || 'ubuntu-26.04' }}
    # The discovery proofs fail here, never skip, when loopback multicast is
    # missing (R76 slice 3).
    env:
      CONNETTO_REQUIRE_MULTICAST: "1"
    timeout-minutes: 90
    # Neither a fork's pull request nor a Dependabot run can read
    # CODECOV_TOKEN, so the upload runs for same-repo branches and main only.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    strategy:
      fail-fast: false
      # The client and rest shards of the Rust tests in ci.yml. The server
      # suite is archived once and run in partitions below. Codecov merges the
      # reports of one commit by their flags.
      matrix:
        include:
          - name: client
            packages: -p connetto-client
          - name: rest
            packages: >-
              -p connetto-core
              -p connetto-schema
              -p connetto-ca
              -p connetto-test-harness
              -p connetto-dioxus
              -p connetto-yew
              -p connetto-file-core
              -p connetto-file-server
              -p connetto-file-client
              -p connetto-peer
              -p connetto-exchange
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        id: cache-1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with llvm-tools
        uses: $/.github/actions/install-rust
        with:
          components: llvm-tools-preview

      - name: Install keyring helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y keyutils dbus gnome-keyring libdbus-1-dev pkg-config

      # --all-features turns on connetto-dioxus's desktop feature.
      - name: Install desktop dependencies
        if: matrix.name == 'rest'
        uses: $/.github/actions/install-desktop-deps

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      - uses: $/.github/actions/pull-test-images

      # testfast is release without the fat link: instrumentation on top of
      # lto and one codegen unit more than doubles the build.
      - name: Run Rust suite under coverage
        run: |
          source <(cargo +stable llvm-cov show-env --sh)
          keyctl session -- cargo +stable nextest run \
            --cargo-profile testfast \
            --all-features \
            --test-threads 4 \
            ${{ matrix.packages }}
          # The desktop Secret Service path, whose child processes inherit the
          # profile environment. The systemd and container groups run with a
          # clean environment, so ci.yml runs them uninstrumented.
          if [ "${{ matrix.name }}" = client ]; then
            CARGO_TEST_PROFILE=testfast scripts/linux-secret-store-tests.sh secret-service
          fi
          cargo +stable llvm-cov report \
            --profile testfast \
            --codecov \
            --output-path codecov.json

      - uses: codecov/codecov-action@v7
        with:
          files: codecov.json
          flags: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Save cargo downloads
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cache-1.outputs.cache-primary-key }}

  # The server suite is the longest, so its instrumented tests are archived
  # once and run in partitions, with the spawned binaries handed over beside
  # the archive.
  coverage-server-build:
    name: Coverage server build
    # The partitions read this job's archive, so both run on emi only while
    # both scale-set variables name emi pools, since put-files and get-files
    # must pick the same store.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(vars.LINUX_LIGHT, 'ubuntu-') && !startsWith(vars.LINUX_HEAVY, 'ubuntu-') && vars.LINUX_LIGHT && vars.LINUX_HEAVY || 'ubuntu-26.04' }}
    timeout-minutes: 60
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7

      - name: Restore cargo downloads
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('dl-{0}-', runner.os) || '' }}

      - name: Install stable toolchain with llvm-tools
        uses: $/.github/actions/install-rust
        with:
          components: llvm-tools-preview

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      # The binaries the e2e tests spawn carry the same instrumentation, so
      # the report counts what the child processes execute too.
      - name: Build and archive the instrumented server suite
        run: |
          source <(cargo +stable llvm-cov show-env --sh)
          cargo +stable build --profile testfast --all-features --bins -p connetto-server -p connetto-client
          mkdir coverage-server
          cargo +stable nextest archive \
            --cargo-profile testfast \
            --all-features \
            -p connetto-server \
            --archive-file coverage-server/suite.tar.zst
          # The archive carries the server's own binary but not the client's.
          cp target/testfast/connetto-client coverage-server/

      - uses: $/.github/actions/put-files
        with:
          name: coverage-server
          path: coverage-server

  coverage-server:
    name: Coverage server ${{ matrix.partition }}/${{ strategy.job-total }}
    needs: coverage-server-build
    # Running the archive compiles nothing, so a light VM is enough.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(vars.LINUX_LIGHT, 'ubuntu-') && !startsWith(vars.LINUX_HEAVY, 'ubuntu-') && vars.LINUX_HEAVY && vars.LINUX_LIGHT || 'ubuntu-26.04' }}
    env:
      CONNETTO_REQUIRE_MULTICAST: "1"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One suite layout on both runner kinds, with more partitions on emi.
      matrix:
        partition: ${{ fromJSON(!startsWith(vars.LINUX_LIGHT, 'ubuntu-') && !startsWith(vars.LINUX_HEAVY, 'ubuntu-') && vars.LINUX_LIGHT && vars.LINUX_HEAVY && '[1, 2, 3, 4]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain with llvm-tools
        uses: $/.github/actions/install-rust
        with:
          components: llvm-tools-preview

      - name: Install keyring helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y keyutils dbus gnome-keyring

      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest

      - uses: $/.github/actions/get-files
        with:
          name: coverage-server
          path: ${{ runner.temp }}/coverage-server

      - uses: $/.github/actions/pull-test-images

      # Extracted into the checkout, where the tests' compiled-in binary
      # paths and the report expect the target directory.
      - name: Run the partition under coverage
        env:
          SUITE: ${{ runner.temp }}/coverage-server
        run: |
          source <(cargo +stable llvm-cov show-env --sh)
          mkdir -p target/testfast
          install -m 0755 "$SUITE/connetto-client" target/testfast/connetto-client
          keyctl session -- cargo +stable nextest run \
            --archive-file "$SUITE/suite.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --extract-to "$GITHUB_WORKSPACE" \
            --extract-overwrite \
            --partition hash:${{ matrix.partition }}/${{ strategy.job-total }} \
            --test-threads 4
          cargo +stable llvm-cov report \
            --profile testfast \
            --codecov \
            --output-path codecov.json

      - uses: codecov/codecov-action@v7
        with:
          files: codecov.json
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
