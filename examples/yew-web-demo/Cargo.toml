[package]
name = "connetto-yew-web-demo"
description = "Yew web demo of the connetto browser topology: windows converging a synced orders list through Postgres and a device-private notes list through the DB worker."
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The demos' shared core, holding the schema, its rows and queries, the pane
# wording, and the browser pieces every browser demo carries.
connetto-demo-support = { path = "../demo-support" }
# The browser platform: transports, leader election, locks, the relay hub,
# and the DB worker orchestration, booted and attached through its
# WebClientBuilder.
connetto-web = { path = "../../crates/connetto-web" }
# The client types the window drives (builder pieces, client, events).
# Default features off: this is a wasm build with a browser transport.
connetto-client = { path = "../../crates/connetto-client", default-features = false }
# The custody standing the header's gate and custody lines name.
connetto-core = { path = "../../crates/connetto-core" }
# The one live-query hook, bound to the component lifecycle.
connetto-yew = { path = "../../crates/connetto-yew" }
yew = { version = "0.23", features = ["csr"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Client-authored primary keys: one strongly typed `rosetta_uuid::Uuid` that
# maps to SQLite BLOB and Postgres uuid from a single schema, minted with the
# browser CSPRNG through getrandom's wasm_js backend.
rosetta-uuid = { version = "0.2.0", features = ["diesel", "sqlite"] }
# Structured logging (R12): this demo emits through `tracing` and installs the
# developer-console destination in `main`.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# `File` and `FileList` back the photo and import file inputs, `History` and
# `Location` the login code delivery in `main`, and the browser test target
# the worker spawn, the fetches and the object URLs it drives.
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "BroadcastChannel",
    "DedicatedWorkerGlobalScope",
    "Event",
    "File",
    "FileList",
    "History",
    "HtmlInputElement",
    "Location",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "Url",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "console",
] }
yew_icons = { version = "0.10.0", features = ["font_awesome_solid"] }

[dev-dependencies]
# The photo surface tests keep their own tables and row structs.
diesel = { version = "2", features = ["sqlite"] }
# FileId and MimeClass for the tests' staging rows.
connetto-file-core = { path = "../../crates/connetto-file-core" }
wasm-bindgen-test = "0.3"
futures-channel = "0.3"
serde_json = "1"
connetto-file-client = { path = "../../crates/connetto-file-client" }

[workspace]

# Verbatim mirror of the root workspace patch blocks. Cargo patches do not
# cross workspaces, so the demo needs the same routing or the diesel backed
# graph will not resolve. The sources and revisions must match the root ones
# exactly. The demo lockfile pins the rest of the graph.
[patch.crates-io]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "master" }
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }
sqlparser_derive = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main" }

[patch."https://github.com/diesel-rs/diesel"]
diesel = { git = "https://github.com/LucaCappelletti94/diesel", branch = "master" }

# Headless tests retain function names without loading DWARF into each browser worker.
[profile.test]
strip = "debuginfo"

# Fast test iteration: release-grade optimization without the fat link.
# Mirrors the root workspace profile of the same name.
[profile.testfast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
