[package]
name = "connetto-tauri-demo"
description = "The connetto demo as a Tauri 2 app, the client in the native core and the shared Leptos demo as its UI."
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "connetto_tauri_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1"
# Local thumbnails travel as `data:` URLs, so the resolved bytes are encoded
# here.
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
connetto-client = { path = "../../../crates/connetto-client", features = ["native-auth"] }
connetto-core = { path = "../../../crates/connetto-core", features = ["logging"] }
# The shared demo core, holding the schema rows and queries, the pane wording
# and the one view and action set the core serves.
connetto-demo-support = { path = "../../demo-support", default-features = false, features = ["client"] }
# The content lane the photos stage through and the export and import name.
connetto-file-client = { path = "../../../crates/connetto-file-client" }
diesel = { version = "2", features = ["sqlite", "chrono"] }
diesel-async = { version = "0.9", default-features = false, features = ["postgres", "bb8"] }
parking_lot = "0.12"
rosetta-uuid = { version = "0.2.0", features = ["diesel", "sqlite", "postgres"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", features = [] }
# The Save As window the export offers and the file write that follows it,
# the route an Android content URI takes to the archive.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
thiserror = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Sign-in through the Custom Tab or the authentication session and the app's
# own redirect, reused unchanged from the dioxus demo.
connetto-auth-session = { path = "../../../crates/connetto-auth-session" }

[target.'cfg(target_os = "android")'.dependencies]
# The Keystore unlock prompt's JNI types.
manganis = "0.7.10"
android_log-sys = "0.3.2"

[features]
# Enrols this device under the deployment root `CONNETTO_DEMO_BUILD_DEVICE_ROOT`
# names at build time, as the dioxus demo's feature does.
device-identity = ["connetto-client/device-identity", "connetto-auth-session/device-identity"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
