[package]
name = "connetto-demo-support"
description = "The browser demos' shared core: the demo schema rows, the pane wording and helpers, and the browser pieces every browser demo carries."
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
# The deployment every browser demo here runs against, documents and all.
connetto-demo-deployment = { path = "../deployment" }
connetto-core = { path = "../../crates/connetto-core" }
# FileId and MimeClass for the staging row and the mime guess, on every target.
connetto-file-core = { path = "../../crates/connetto-file-core" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
diesel = { version = "2", features = ["sqlite", "chrono"] }
# One strongly typed `rosetta_uuid::Uuid` that maps to SQLite BLOB and Postgres
# uuid from a single schema, minted with the browser CSPRNG through getrandom's
# wasm_js backend on wasm.
rosetta-uuid = { version = "0.2.0", features = ["diesel", "sqlite"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

# The browser platform, meaning the transport, the leader election, the relay
# hub and the DB worker, reached through its WebClientBuilder.
[target.'cfg(target_arch = "wasm32")'.dependencies]
connetto-client = { path = "../../crates/connetto-client", default-features = false }
connetto-web = { path = "../../crates/connetto-web" }
js-sys = "0.3"
wasm-bindgen = "0.2"
# `Blob` and `Url` back the export download, `BroadcastChannel` the
# worker-to-page channels, `Storage` the last signed-in account across
# reloads, a non-secret identifier.
web-sys = { version = "0.3", features = [
  "Blob",
  "BroadcastChannel",
  "Document",
  "Element",
  "HtmlAnchorElement",
  "MessageEvent",
  "Storage",
  "Url",
  "Window",
] }

# The native builds take the client with its native transport, the browser one
# leaves it off, since a wasm target has no native WebSocket.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
connetto-client = { path = "../../crates/connetto-client" }

# The schema step. It translates the deployment's shared schema and policies
# plus the demos' local tier into the bundle the app includes and the version
# it presents at handshake.
[build-dependencies]
connetto-schema = { path = "../../crates/connetto-schema" }

[lints.rust]
missing_docs = "deny"
